[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "PyCO2SYS"
description = "PyCO2SYS: marine carbonate system calculations in Python"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "jax>=0.10,<0.12",
    "networkx>=3.2.1,<4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11,<4",
    "pandas>=3,<4",
    "pygraphviz>=2,<3",
    "pytest>=9.1.1,<10",
    "pytest-xdist>=3.8.0,<4",
    "xarray>=2026.7.0",
]

[tool.setuptools.packages.find]
include = ["PyCO2SYS*"]

[tool.setuptools.dynamic]
version = {attr = "PyCO2SYS.meta.version"}

[tool.setuptools.package-data]
"PyCO2SYS.uncertainty.covmx" = ["*.txt"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = [
    "EXE002",  # shebang-missing-executable-file
    "N999",  # invalid-module-name
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
known-first-party = ["PyCO2SYS"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest]
minversion = "9.0"
norecursedirs = [
    ".*",
    "*.egg*",
    "build",
    "dist",
    "docs",
    "site",
    "PyCO2SYS",
]
testpaths = ["tests"]
python_files = ["test_*.py", "compare_*.py"]
